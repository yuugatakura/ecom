<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natzach — Miliki Toko, Traffic, dan Pelangganmu Sendiri</title>
<meta name="description" content="Natzach bangun toko, mesin traffic, dan daftar pelanggan yang sepenuhnya kamu miliki — supaya margin yang selama ini numpang jualan ke marketplace, balik ke kantong kamu.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="#top" class="logo">Natzach</a>
    <nav class="nav-desktop" id="navDesktop" aria-label="Navigasi utama"></nav>
    <div class="header-actions">
      <div class="social-icons" id="socialIcons"></div>
      <button class="btn btn-accent btn-small nav-cta" id="navCta" type="button">Book Free Consultation</button>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Buka menu" aria-expanded="false" aria-controls="navMobile">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-mobile" id="navMobile">
    <nav id="navMobileLinks" aria-label="Navigasi mobile"></nav>
    <div class="social-icons social-icons-mobile" id="socialIconsMobile"></div>
    <button class="btn btn-accent btn-block" id="navCtaMobile" type="button">Book Free Consultation</button>
  </div>
</header>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Tutup form" type="button">&times;</button>
    <p class="eyebrow" id="modalEyebrow"></p>
    <h3 class="modal-title" id="modalTitle"></h3>
    <p class="modal-sub" id="modalSub"></p>
    <form id="leadForm" class="lead-form">
      <div class="field">
        <label for="fName" id="lblName"></label>
        <input type="text" id="fName" required>
      </div>
      <div class="field">
        <label for="fBrand" id="lblBrand"></label>
        <input type="text" id="fBrand" required>
      </div>
      <div class="field">
        <label for="fWhatsapp" id="lblWhatsapp"></label>
        <input type="tel" id="fWhatsapp" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fRevenue" id="lblRevenue"></label>
          <select id="fRevenue"></select>
        </div>
        <div class="field">
          <label for="fChannel" id="lblChannel"></label>
          <select id="fChannel"></select>
        </div>
      </div>
      <button type="submit" class="btn btn-accent btn-block btn-large" id="leadSubmit"></button>
      <a class="modal-fallback" id="modalFallback" target="_blank" rel="noopener"></a>
    </form>
  </div>
</div>

<a class="wa-float" id="waFloat" href="" target="_blank" rel="noopener" aria-label="Chat WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.693.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"></path><path d="M12.001 2C6.478 2 2 6.477 2 12c0 1.86.505 3.605 1.383 5.104L2 22l5.03-1.352A9.958 9.958 0 0 0 12.001 22C17.523 22 22 17.523 22 12S17.523 2 12.001 2zm0 18.111c-1.655 0-3.194-.487-4.489-1.322l-.322-.198-2.988.803.813-2.909-.211-.328A8.086 8.086 0 0 1 3.889 12c0-4.472 3.64-8.111 8.112-8.111 4.471 0 8.111 3.639 8.111 8.111 0 4.472-3.64 8.111-8.111 8.111z"></path></svg>
</a>

<main id="top">

  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero-inner">
      <h1 class="hero-headline" id="heroHeadline"></h1>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-actions">
        <button class="btn btn-accent btn-large" id="heroCta" type="button">Book Free Consultation</button>
        <a class="link-secondary" id="heroSecondary"></a>
      </div>
      <p class="hero-microcopy" id="heroMicrocopy"></p>
    </div>

    <div class="wrap">
      <div class="leak-viz reveal" id="leakViz">
        <div class="leak-viz-head">
          <h2 class="leak-title" id="leakTitle"></h2>
          <p class="leak-caption" id="leakCaption"></p>
        </div>

        <div class="leak-columns">
          <div class="leak-col">
            <div class="leak-col-label">Marketplace</div>
            <div class="leak-bar leak-bar-market" id="leakBarMarket" role="img" aria-label="Rincian potongan biaya marketplace"></div>
            <ul class="leak-legend" id="leakLegend"></ul>
          </div>
          <div class="leak-col">
            <div class="leak-col-label">Kanal Sendiri</div>
            <div class="leak-bar leak-bar-owned" id="leakBarOwned">
              <span class="leak-bar-owned-fill"></span>
              <span class="leak-bar-owned-value" id="leakOwnedValue"></span>
            </div>
            <p class="leak-owned-note" id="leakOwnedNote"></p>
          </div>
        </div>

        <p class="leak-callout"><span id="leakCallout"></span> <cite id="leakCalloutSource"></cite></p>

        <div class="calc-block">
          <p class="eyebrow" id="calcEyebrow"></p>
          <h3 class="calc-block-title" id="calcTitle"></h3>
          <div class="calc-input-row">
            <label for="calcInput" id="calcInputLabel"></label>
            <div class="calc-input-wrap">
              <span class="calc-input-prefix">Rp</span>
              <input type="text" inputmode="numeric" id="calcInput">
            </div>
          </div>
          <div class="calc-outputs">
            <div class="calc-out calc-out-bad">
              <span id="calcMarketLabel"></span>
              <strong class="tnum" id="calcMarketValue"></strong>
            </div>
            <div class="calc-out calc-out-neutral">
              <span id="calcOwnedLabel"></span>
              <strong class="tnum" id="calcOwnedValue"></strong>
            </div>
            <div class="calc-out calc-out-good">
              <span id="calcSavingsLabel"></span>
              <strong class="tnum" id="calcSavingsValue"></strong>
              <small class="tnum" id="calcSavingsYear"></small>
            </div>
          </div>
          <p class="calc-note" id="calcNote"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- PAIN GRID -->
  <section id="masih-di-marketplace" class="section pain">
    <div class="wrap">
      <p class="eyebrow" id="painEyebrow"></p>
      <h2 class="section-title" id="painTitle"></h2>
      <div class="pain-grid" id="painGrid"></div>
    </div>
  </section>

  <!-- BENTO / CARA KERJA -->
  <section id="cara-kerja" class="section bento">
    <div class="wrap">
      <p class="eyebrow" id="bentoEyebrow"></p>
      <h2 class="section-title" id="bentoTitle"></h2>
      <div class="bento-grid" id="bentoGrid"></div>
    </div>
  </section>

  <!-- BUKTI KERJA -->
  <section id="bukti-kerja" class="section proof">
    <div class="wrap">
      <p class="eyebrow" id="proofEyebrow"></p>
      <h2 class="section-title" id="proofTitle"></h2>
      <p class="section-intro" id="proofIntro"></p>
      <div class="proof-grid" id="proofGrid"></div>
    </div>
  </section>

  <!-- KENAPA BEDA -->
  <section id="kenapa-beda" class="section why">
    <div class="wrap">
      <p class="eyebrow" id="whyEyebrow"></p>
      <h2 class="section-title" id="whyTitle"></h2>
      <div class="why-grid" id="whyGrid"></div>
    </div>
  </section>

  <!-- TESTIMONIALS -->
  <section id="testimoni" class="section testimonials">
    <div class="wrap">
      <p class="eyebrow" id="testiEyebrow"></p>
      <h2 class="section-title" id="testiTitle"></h2>
      <div class="testi-grid" id="testiGrid"></div>
    </div>
  </section>

  <!-- METRICS -->
  <section id="metrik" class="section metrics">
    <div class="wrap">
      <p class="eyebrow" id="metricsEyebrow"></p>
      <h2 class="section-title" id="metricsTitle"></h2>
      <div class="metrics-grid" id="metricsGrid"></div>
    </div>
  </section>

  <!-- OPERATOR -->
  <section id="operator" class="section operator">
    <div class="wrap operator-inner">
      <div class="operator-photo" id="operatorPhoto"></div>
      <div class="operator-content">
        <p class="eyebrow" id="operatorEyebrow"></p>
        <h2 class="section-title" id="operatorTitle"></h2>
        <p class="operator-name" id="operatorName"></p>
        <ul class="operator-principles" id="operatorPrinciples"></ul>
      </div>
    </div>
  </section>

  <!-- FAQ -->
  <section id="faq" class="section faq">
    <div class="wrap">
      <p class="eyebrow" id="faqEyebrow"></p>
      <h2 class="section-title" id="faqTitle"></h2>
      <div class="faq-list" id="faqList"></div>
    </div>
  </section>

  <!-- FINAL CTA -->
  <section class="section final-cta">
    <div class="wrap final-cta-inner">
      <h2 class="final-cta-headline" id="finalHeadline"></h2>
      <p class="final-cta-sub" id="finalSub"></p>
      <ol class="final-steps" id="finalSteps"></ol>
      <button class="btn btn-accent btn-large" id="finalCta" type="button">Book Free Consultation</button>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span class="logo logo-small">Natzach</span>
    <div class="social-icons" id="socialIconsFooter"></div>
    <span class="footer-tagline" id="footerTagline"></span>
  </div>
</footer>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
